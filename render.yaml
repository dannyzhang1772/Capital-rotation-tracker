# Render blueprint for the projectmodl.com backend (signed-in Trading portal).
# Deploy: Render dashboard -> New -> Blueprint -> pick this repository, then fill in the five values it asks for:
# SUPABASE_URL, SUPABASE_SERVICE_KEY (the secret key), ALLOWED_EMAILS (comma-separated invite list),
# SNAPTRADE_CLIENT_ID and SNAPTRADE_CONSUMER_KEY. TOKEN_KEY and ADMIN_TOKEN are generated once and must not change.
services:
  - type: web
    name: projectmodl-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ALLOWED_EMAILS
        sync: false
      - key: SNAPTRADE_CLIENT_ID
        sync: false
      - key: SNAPTRADE_CONSUMER_KEY
        sync: false
      - key: TOKEN_KEY
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://dannyzhang1772.github.io,https://projectmodl.com,https://www.projectmodl.com
      - key: FRONTEND_URL
        value: https://dannyzhang1772.github.io/Capital-rotation-tracker/trading.html
